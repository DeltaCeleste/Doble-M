<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vista Actividad - Personal</title>
    <!-- Il tuo CSS -->
    <link rel="stylesheet" href="css/personal.css">
</head>
<body>

    <article class="actividad-detalle-card" aria-labelledby="actividad-titulo">
        <header class="actividad-header">
            <h2 id="actividad-titulo" class="actividad-titulo">Taller de Jardinería</h2>
        </header>

        <div class="actividad-cuerpo">
            <section class="actividad-seccion temporalidad">
                <h3>Temporalización</h3>
                <p><strong>Fecha:</strong> 05/11/2026</p>
                <p><strong>Horario:</strong> 10:00 - 11:30</p>
            </section>

            <section class="actividad-seccion descripcion">
                <h3>Descripción</h3>
                <p>Preparar las macetas y regar las plantas del patio interior.</p>
            </section>

            <section class="actividad-seccion destinatarios">
                <h3>Alumnado asignado</h3>
                <p class="etiqueta-grupo"><strong>Grupo/Aula:</strong> Aula PTVAL A</p>
                <ul class="lista-alumnado">
                    <li class="item-estudiante">
                        <span class="nombre-estudiante">Juan Pérez</span>
                    </li>
                    <li class="item-estudiante">
                        <span class="nombre-estudiante">María Gómez</span>
                    </li>
                </ul>
            </section>
        </div>
    </article>

</body>
</html>
